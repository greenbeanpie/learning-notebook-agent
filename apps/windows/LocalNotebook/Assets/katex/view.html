<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="katex.min.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #e3e3e3;
    font: 14px/1.2 "Segoe UI","Microsoft YaHei UI",sans-serif;
    overflow: hidden;
  }
  #stage {
    display: inline-block;
    white-space: nowrap;
  }
  #formula {
    display: inline-block;
    padding: 2px 4px;
    white-space: nowrap;
  }
  #formula:not(.display) .katex {
    font-size: 1.05em;
  }
  #formula.display {
    padding: 12px 16px;
    line-height: 1.4;
  }
  #probe {
    display: inline-block;
    width: 0;
    height: 0;
    vertical-align: baseline;
  }
  #atlas {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    align-content: flex-start;
    gap: 8px;
    padding: 4px;
    max-width: 1560px;
    width: max-content;
    box-sizing: border-box;
  }
  .batch-item {
    display: inline-block;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .batch-formula {
    display: inline-block;
    padding: 2px 4px;
    white-space: nowrap;
  }
  .batch-formula:not(.display) .katex {
    font-size: 1.05em;
  }
  .batch-formula.display {
    padding: 12px 16px;
    line-height: 1.4;
  }
  .batch-probe {
    display: inline-block;
    width: 0;
    height: 0;
    vertical-align: baseline;
  }
</style>
</head>
<body><div id="stage"><div id="formula"></div><span id="probe"></span></div><div id="atlas"></div>
<script src="katex.min.js"></script>
<script src="mhchem.min.js"></script>
<script src="view.js"></script>
</body>
</html>
