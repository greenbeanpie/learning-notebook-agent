[workspace]
resolver = "2"
members = [
    "crates/lna-types",
    "crates/lna-storage",
    "crates/lna-secrets",
    "crates/lna-jobs",
    "crates/lna-llm",
    "crates/lna-embedding",
    "crates/lna-ingest",
    "crates/lna-retrieval",
    "crates/lna-agent",
    "crates/lna-studio",
    "crates/lna-tts",
    "crates/lna-api",
    "crates/lna-ffi",
    "crates/lna-devtools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
rusqlite = { version = "0.43", features = ["bundled", "modern_sqlite"] }
sqlite-vec = "0.1.6"
jieba-rs = "0.7"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-normalization = "0.1"
pulldown-cmark = "0.12"
scraper = "0.21"
pdfium-render = "0.8"
quick-xml = "0.41"
csv = "1.3"
cfb = "0.7"
flate2 = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
ort = "=2.0.0-rc.10"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
secrecy = { version = "0.10", features = ["serde"] }
jsonschema = "0.26"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "xz"] }
hex = "0.4"
ulid = "1.1"
url = "2.5"
rand = "0.8"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.11", features = ["v4"] }
