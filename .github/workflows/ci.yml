name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build & Unit Tests
        run: cargo test --workspace
      - name: E2E Smoke Test
        shell: pwsh
        run: pwsh tests/e2e/run-smoke.ps1

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build & Publish WinUI 3 AOT
        run: |
          dotnet build apps/windows/LocalNotebook/LocalNotebook.csproj -p:Platform=x64
          dotnet publish apps/windows/LocalNotebook/LocalNotebook.csproj -c Release -r win-x64
