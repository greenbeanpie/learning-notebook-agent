name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch PDFium (pinned, checksum-verified)
        shell: pwsh
        run: pwsh scripts/fetch-pdfium.ps1 -Dest target/debug
      - name: Build & Unit Tests
        env:
          LNA_REQUIRE_PDFIUM: '1'
        run: cargo test --workspace
      - name: Upload retrieval evaluation report (Recall@8, MRR, refusal rate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: target/eval-report.json
          if-no-files-found: ignore
      - name: Build every binary (the smoke test drives lna-devtools)
        run: cargo build --workspace --all-targets
      - name: E2E Smoke Test (including PDF import)
        shell: pwsh
        run: pwsh tests/e2e/run-smoke.ps1 -Pdf

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble the runnable client (core + NativeAOT client + PDFium)
        shell: pwsh
        run: pwsh scripts/package-windows-client.ps1 -Out dist/LocalNotebook
      - uses: actions/upload-artifact@v4
        with:
          name: LocalNotebook-win-x64
          path: dist/LocalNotebook
