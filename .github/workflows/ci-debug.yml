name: CI debug
on:
  push:
    branches: [ ci/fix-ort-sys ]
jobs:
  ort:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare target dirs
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path target/debug/examples,target/debug/deps | Out-Null
      - name: Build ort-sys with debug output
        shell: pwsh
        env:
          RUST_BACKTRACE: '1'
        run: |
          cargo build -p lna-embedding 2>&1 | Select-Object -Last 40
          Write-Host "---- dirs"
          Get-ChildItem -Recurse -Depth 2 "$env:APPDATA\ort.pyke.io" -ErrorAction SilentlyContinue | Select-Object -First 30 FullName, Length
          Get-ChildItem target/debug -ErrorAction SilentlyContinue | Select-Object -First 30 Name
          exit 0
